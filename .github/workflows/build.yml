name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        shell: bash
        run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Mostrar erro
        if: failure()
        shell: bash
        run: |
          {
            echo '## Erro do build'
            echo '```'
            (grep -n -E -A12 'What went wrong|error:|^e: ' build.log || tail -n 40 build.log) | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: FpsLite-apk
          path: app/build/outputs/apk/release/*.apk
